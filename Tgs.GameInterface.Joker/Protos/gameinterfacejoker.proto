syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.Joker.Protos";

package gameinterfacejoker;

// The greeting service definition.
service GameInterfaceJoker {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameToken (GameTokenRequest) returns (GameTokenReply);
  rpc GameRecord (GameRecordRequest) returns (GameRecordReply);
  rpc GameRecordDetails (GameRecordDetailsRequest) returns (GameRecordDetailsReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string player_code = 4;
}

message PlayerBalanceRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string player_code = 4;
}

message PlayerLogoutRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string player_code = 4;
}

message FundRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string player_code = 4;
	string transaction_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string transaction_id = 4;
}

message GameTokenRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string player_code = 4;
}

message GameRecordRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string player_code = 4;
	google.protobuf.Timestamp start_time = 5;
	google.protobuf.Timestamp end_time = 6;
	string next_id = 7;
}

message GameRecordDetailsRequest {
	string api_url = 1;
    string app_id = 2;
    string secret_key = 3;
	string external_round_id = 4;
	string language = 5;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string request_id = 1;
	string res = 2;
}

message GameTokenReply{
	string token = 1;
}

message GameRecordReply {
	string next_id = 1;
	repeated GameRecordInfo items = 2;
}

message GameRecordInfo {
	string external_round_id = 1;
	string external_game_id = 2;
    string player_code = 3;
	google.protobuf.Timestamp external_created_on = 4;
	google.protobuf.Timestamp external_closed_on = 5;
	phoenix.protobuf.DecimalValue bet = 6;
	phoenix.protobuf.DecimalValue settle = 7;
	phoenix.protobuf.DecimalValue win_loss = 8;
	string additional_data = 9;
}

message GameRecordDetailsReply {
	string url = 1;
}

message CheckingServiceReply{
    string machine_name = 1;
}